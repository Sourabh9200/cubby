name: finance_app
description: "Cubby — local-first, encrypted, Android. Track spends, see trends, ask questions privately."
publish_to: 'none'
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local encrypted storage: drift tables, DAOs, and passphrase handling.
  finance_db:
    path: ../../packages/finance_db

  # Used directly for query-stream invalidation and companion values in the
  # repository layer. Declared explicitly rather than relied on transitively.
  drift: ^2.35.0

  # Charts for the dashboard and trend screens. MIT licensed, no paid tier.
  fl_chart: ^1.2.0

  # Currency, date, and number formatting. INR grouping is not something to
  # hand-roll: Indian digit grouping (1,23,456.78) differs from Western.
  intl: ^0.20.3

  # Collision-resistant primary keys for user-created rows.
  uuid: ^4.6.0

  # AES-256-GCM plus PBKDF2 for the encrypted backup file. Pure Dart, so it
  # needs no platform plugin and behaves identically under `flutter test`.
  cryptography: ^2.9.0

  # The system file picker and save-as dialog, so a backup can leave the app's
  # private sandbox and be chosen again on the way back. One plugin covers both
  # directions, which is why `share_plus` is not needed here.
  file_picker: ^13.0.0

  # Fingerprint / face / device-PIN unlock. The database is already encrypted at
  # rest; this is the screen-level gate in front of it, which is the layer the
  # app's own passphrase comment said belonged to `local_auth`.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
