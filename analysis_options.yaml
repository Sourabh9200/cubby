# Self-contained lint config (no external package dependency).
# Applies hierarchically to every package in the workspace.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A trust boundary must not ship with dead code or sloppy nullability.
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unused_element: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_relative_lib_imports
    - cancel_subscriptions
    - cascade_invocations
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sized_box_for_whitespace
    - sort_constructors_first
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_string_buffers
